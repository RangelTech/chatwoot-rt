name: Fork maintenance

on:
  pull_request:
    paths:
      - 'chatwoot/**'
      - 'scripts/verify_fork_extensions.rb'
      - 'scripts/upgrade/**'
      - 'docs/architecture/fork-maintenance.md'
      - '.github/workflows/fork-maintenance.yml'
  push:
    branches: [main]
    paths:
      - 'chatwoot/**'
      - 'scripts/verify_fork_extensions.rb'
      - 'scripts/upgrade/**'
      - 'docs/architecture/fork-maintenance.md'
      - '.github/workflows/fork-maintenance.yml'

permissions:
  contents: read

jobs:
  extension-contract:
    name: Validate fork extension contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby scripts/verify_fork_extensions.rb
      - name: Divergencia medida contra o upstream importado
        run: |
          git fetch origin upstream-import:upstream-import
          python3 scripts/upgrade/divergence.py --base upstream-import --head HEAD --fail-on-unmarked
