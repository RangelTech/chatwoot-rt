name: Deploy chatwoot-web to Cloud Run

# CI/CD real (infra-01/infra-03, 21/08/2026): substitui o deploy manual
# (`infra/deploy.sh chatwoot`, gcloud rodado na mão). Auth via Workload
# Identity Federation (sem chave de SA em secret nenhum) + segredos
# rotativos do Infisical (mesma Machine Identity que deploy-vps.yml usa).
#
# Sidekiq (worker) continua na VPS via deploy-vps.yml -- não é este
# workflow. Migração de schema é passo manual explícito
# (`infra/deploy.sh migrate`), não roda aqui de propósito.

on:
  push:
    branches: [main]
    paths:
      - "chatwoot/**"
      - "infra/cloudbuild-chatwoot.yaml"
      - "infra/terraform/**"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Achado real 24/08/2026: este workflow nunca teve concurrency group
    # (diferente de agent-platform/kernel-llm, que já tinham essa proteção
    # -- mesmo achado de arquitetura da madrugada de 23/08, só que aqui
    # ficou pra trás). 2 pushes seguidos rápidos disparam 2 runs em
    # paralelo sem ordem garantida -- o que terminar por último vence,
    # podendo reverter um fix mais novo silenciosamente. cancel-in-progress
    # serializa: o run mais novo cancela o mais velho do mesmo grupo.
    concurrency:
      group: chatwoot-web-cloudrun-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch rotating secrets from Infisical
        id: infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          fetch_secret() {
            local name="$1"
            local value
            value=$(curl -fsS "https://infisical.rangeltech.net/api/v3/secrets/raw/$name?workspaceId=ea111402-d9d4-4ffe-b23f-ccc253340fd8&environment=prod&secretPath=%2F" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue')
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Secret $name not found in Infisical" >&2
              exit 1
            fi
            echo "::add-mask::$value" >&2
            echo "$value"
          }

          {
            echo "postgres_password<<EOF_PG"
            fetch_secret POSTGRES_PASSWORD
            echo "EOF_PG"
            echo "secret_key_base<<EOF_SKB"
            fetch_secret SECRET_KEY_BASE
            echo "EOF_SKB"
            echo "redis_url<<EOF_REDIS"
            fetch_secret REDIS_URL
            echo "EOF_REDIS"
            echo "storage_secret_access_key<<EOF_S3"
            fetch_secret STORAGE_SECRET_ACCESS_KEY
            echo "EOF_S3"
            echo "storage_access_key_id<<EOF_S3ID"
            fetch_secret STORAGE_ACCESS_KEY_ID
            echo "EOF_S3ID"
            echo "fb_app_id<<EOF_META"
            fetch_secret FB_APP_ID
            echo "EOF_META"
            echo "fb_app_secret<<EOF_META"
            fetch_secret FB_APP_SECRET
            echo "EOF_META"
            echo "fb_verify_token<<EOF_META"
            fetch_secret FB_VERIFY_TOKEN
            echo "EOF_META"
            echo "instagram_app_id<<EOF_META"
            fetch_secret INSTAGRAM_APP_ID
            echo "EOF_META"
            echo "instagram_app_secret<<EOF_META"
            fetch_secret INSTAGRAM_APP_SECRET
            echo "EOF_META"
            echo "instagram_verify_token<<EOF_META"
            fetch_secret INSTAGRAM_VERIFY_TOKEN
            echo "EOF_META"
            echo "oauth_browser_admin_token<<EOF_OBT"
            fetch_secret OAUTH_BROWSER_ADMIN_TOKEN
            echo "EOF_OBT"
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          gcloud builds submit --project=rangel-tech \
            --config=infra/cloudbuild-chatwoot.yaml \
            --substitutions=SHORT_SHA=${{ github.sha }} .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform import (no-op if already tracked)
        working-directory: infra/terraform
        timeout-minutes: 3
        env:
          # terraform import valida o modulo inteiro antes de importar (achado
          # real, 21/08/2026) -- precisa das mesmas TF_VAR_* do apply, senao
          # falha com "No value for required variable", o import nunca roda
          # (erro escondido pelo `|| true`) e o apply seguinte tenta CREATE
          # num recurso que ja existe -> 409.
          TF_VAR_image: us-central1-docker.pkg.dev/rangel-tech/containers/chatwoot-rt:${{ github.sha }}
          TF_VAR_postgres_password: ${{ steps.infisical.outputs.postgres_password }}
          TF_VAR_secret_key_base: ${{ steps.infisical.outputs.secret_key_base }}
          TF_VAR_redis_url: ${{ steps.infisical.outputs.redis_url }}
          TF_VAR_storage_access_key_id: ${{ steps.infisical.outputs.storage_access_key_id }}
          TF_VAR_storage_secret_access_key: ${{ steps.infisical.outputs.storage_secret_access_key }}
          TF_VAR_fb_app_id: ${{ steps.infisical.outputs.fb_app_id }}
          TF_VAR_fb_app_secret: ${{ steps.infisical.outputs.fb_app_secret }}
          TF_VAR_fb_verify_token: ${{ steps.infisical.outputs.fb_verify_token }}
          TF_VAR_instagram_app_id: ${{ steps.infisical.outputs.instagram_app_id }}
          TF_VAR_instagram_app_secret: ${{ steps.infisical.outputs.instagram_app_secret }}
          TF_VAR_instagram_verify_token: ${{ steps.infisical.outputs.instagram_verify_token }}
          TF_VAR_oauth_browser_admin_token: ${{ steps.infisical.outputs.oauth_browser_admin_token }}
        run: |
          terraform import -input=false -lock=false google_cloud_run_v2_service.chatwoot_web \
            projects/rangel-tech/locations/us-central1/services/chatwoot-web || true
          terraform import -input=false -lock=false google_cloud_run_v2_service_iam_member.public \
            "projects/rangel-tech/locations/us-central1/services/chatwoot-web roles/run.invoker allUsers" || true

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_image: us-central1-docker.pkg.dev/rangel-tech/containers/chatwoot-rt:${{ github.sha }}
          TF_VAR_postgres_password: ${{ steps.infisical.outputs.postgres_password }}
          TF_VAR_secret_key_base: ${{ steps.infisical.outputs.secret_key_base }}
          TF_VAR_redis_url: ${{ steps.infisical.outputs.redis_url }}
          TF_VAR_storage_access_key_id: ${{ steps.infisical.outputs.storage_access_key_id }}
          TF_VAR_storage_secret_access_key: ${{ steps.infisical.outputs.storage_secret_access_key }}
          TF_VAR_fb_app_id: ${{ steps.infisical.outputs.fb_app_id }}
          TF_VAR_fb_app_secret: ${{ steps.infisical.outputs.fb_app_secret }}
          TF_VAR_fb_verify_token: ${{ steps.infisical.outputs.fb_verify_token }}
          TF_VAR_instagram_app_id: ${{ steps.infisical.outputs.instagram_app_id }}
          TF_VAR_instagram_app_secret: ${{ steps.infisical.outputs.instagram_app_secret }}
          TF_VAR_instagram_verify_token: ${{ steps.infisical.outputs.instagram_verify_token }}
          TF_VAR_oauth_browser_admin_token: ${{ steps.infisical.outputs.oauth_browser_admin_token }}
        run: terraform apply -input=false -lock=false -auto-approve

      - name: Smoke check
        # data_services do /api e um falso-negativo conhecido (achado real,
        # 21/08/2026): ActiveRecord::Base.connection.active? reporta false
        # nesse endpoint especifico mesmo com o Postgres saudavel -- provado
        # rodando uma query real autenticada (GET .../messages) contra a
        # mesma revisao e recebendo dado real de volta. queue_services (Redis)
        # reporta certo, entao o check real e HTTP 200 + queue_services:ok.
        run: |
          curl -fsS "https://chat.rangeltech.net/api" | grep -q '"queue_services":"ok"'
