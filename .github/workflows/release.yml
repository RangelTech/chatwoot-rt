name: Release
# Publica 2 imagens (chatwoot-rails, chatwoot-bridge) como docker-archive + manifesto por servico.
# NAO faz deploy: so o vps_rt_infra implanta.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: v0.1.1); cria a tag no commit atual"
        required: true
permissions:
  contents: write
jobs:
  gate-bridge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chatwoot_bridge_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bridge/requirements-dev.txt ruff
      - run: ruff check bridge
      - name: pytest
        working-directory: bridge
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5433/chatwoot_bridge_test
        run: pytest -q -m "integration or not integration"

  build-bridge:
    needs: gate-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Build + save
        run: |
          docker build -f bridge/Dockerfile --build-arg GIT_COMMIT="${GITHUB_SHA}" -t "chatwoot-rt/bridge:${V}" .
          docker inspect --format '{{json .Config.Healthcheck}}' "chatwoot-rt/bridge:${V}" | grep -q Test
          test "$(docker run --rm --entrypoint id "chatwoot-rt/bridge:${V}" -u)" != 0
          docker save "chatwoot-rt/bridge:${V}" | gzip -9 > chatwoot-bridge.image.tar.gz
          ls -l chatwoot-bridge.image.tar.gz
      - name: Manifesto
        run: |
          python3 scripts/release/make_manifest.py --service chatwoot-bridge \
            --archive chatwoot-bridge.image.tar.gz --tag "chatwoot-rt/bridge:${V}" \
            --version "${V}" --commit "${GITHUB_SHA}" --port 8100 --timeout 90 \
            --env DATABASE_URL,ENCRYPTION_KEY,BRIDGE_ADMIN_TOKEN,BRIDGE_PUBLIC_URL,CHATWOOT_BASE_URL,CHATWOOT_PLATFORM_TOKEN,AGENT_PLATFORM_URL \
            --memory 512m --cpus 0.5 --out release-manifest.chatwoot-bridge.json
      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: |
            chatwoot-bridge.image.tar.gz
            release-manifest.chatwoot-bridge.json
          compression-level: 0

  build-rails:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build (cache de camadas no GHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: chatwoot/Dockerfile
          load: true
          tags: chatwoot-rt/rails:${{ env.V }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=rails
          cache-to: type=gha,scope=rails,mode=max
      - name: Verificacoes da imagem
        run: |
          I="chatwoot-rt/rails:${V}"
          docker inspect --format '{{json .Config.Healthcheck}}' "$I" | grep -q Test
          test "$(docker run --rm --entrypoint id "$I" -u)" != 0
          docker run --rm --entrypoint sh "$I" -c 'test -x /app/rt-healthcheck.sh && test -x /app/rt-web.sh && test -x /app/rt-worker.sh && ruby -e "puts :ok"'
      - name: Save
        run: |
          docker save "chatwoot-rt/rails:${V}" | gzip -9 > chatwoot-rails.image.tar.gz
          ls -l chatwoot-rails.image.tar.gz
          test "$(stat -c %s chatwoot-rails.image.tar.gz)" -lt 2000000000
      - name: Manifesto
        run: |
          python3 scripts/release/make_manifest.py --service chatwoot-rails \
            --archive chatwoot-rails.image.tar.gz --tag "chatwoot-rt/rails:${V}" \
            --version "${V}" --commit "${GITHUB_SHA}" --port 3000 --timeout 240 \
            --env SECRET_KEY_BASE,POSTGRES_HOST,POSTGRES_DATABASE,POSTGRES_USERNAME,POSTGRES_PASSWORD,REDIS_URL,FRONTEND_URL,ACTIVE_STORAGE_SERVICE,STORAGE_BUCKET_NAME,STORAGE_ENDPOINT,STORAGE_ACCESS_KEY_ID,STORAGE_SECRET_ACCESS_KEY,BRIDGE_URL,BRIDGE_ADMIN_TOKEN \
            --memory 2g --cpus 2 --pre-deploy chatwoot-migrate --out release-manifest.chatwoot-rails.json
      - uses: actions/upload-artifact@v4
        with:
          name: rails
          path: |
            chatwoot-rails.image.tar.gz
            release-manifest.chatwoot-rails.json
          compression-level: 0

  publish:
    needs: [build-bridge, build-rails]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          ls -l dist
          gh release create "$V" dist/release-manifest.chatwoot-rails.json dist/chatwoot-rails.image.tar.gz \
            dist/release-manifest.chatwoot-bridge.json dist/chatwoot-bridge.image.tar.gz \
            --title "$V" --notes "Artefatos docker-archive (sha256 nos manifestos). Deploy: somente vps_rt_infra." --target "${GITHUB_SHA}" \
            || gh release upload "$V" dist/* --clobber
