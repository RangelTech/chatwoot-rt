name: Infisical - set secret

# Utilitario reusavel: escreve/atualiza um secret no Infisical (projeto
# chatwoot-prod, env prod) usando a mesma Machine Identity que o
# deploy-vps.yml ja usa pra LER segredos. Existe porque nao ha acesso de
# UI/admin ao Infisical disponivel fora do GitHub Actions -- este workflow
# e o unico jeito de escrever secrets sem login humano na instancia.
#
# Uso: Actions -> "Infisical - set secret" -> Run workflow, preencher
# secret_name e secret_value.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Nome do secret no Infisical (ex: STORAGE_SECRET_ACCESS_KEY)"
        required: true
      secret_value:
        description: "Valor novo do secret"
        required: true

jobs:
  set-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set secret in Infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          NAME="${{ inputs.secret_name }}"
          VALUE='${{ inputs.secret_value }}'
          echo "::add-mask::$VALUE"

          # Tenta update; se o secret nao existir ainda (404), cria.
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH "https://infisical.rangeltech.net/api/v3/secrets/raw/$NAME?workspaceId=ea111402-d9d4-4ffe-b23f-ccc253340fd8&environment=prod&secretPath=%2F" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"secretValue\": $(printf '%s' "$VALUE" | jq -Rs .)}")

          if [ "$HTTP_CODE" = "404" ]; then
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
              -X POST "https://infisical.rangeltech.net/api/v3/secrets/raw/$NAME?workspaceId=ea111402-d9d4-4ffe-b23f-ccc253340fd8&environment=prod&secretPath=%2F" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"secretValue\": $(printf '%s' "$VALUE" | jq -Rs .)}")
          fi

          echo "http_code=$HTTP_CODE"
          cat /tmp/resp.json
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Infisical API returned $HTTP_CODE" >&2
            exit 1
          fi
          echo "OK: $NAME updated in Infisical"
