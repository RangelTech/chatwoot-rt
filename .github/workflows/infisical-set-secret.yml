name: Infisical - set secret

# Utilitario reusavel: escreve/atualiza um secret no Infisical (projeto
# chatwoot-prod, env prod) usando a mesma Machine Identity que o
# deploy-vps.yml ja usa pra LER segredos. Existe porque nao ha acesso de
# UI/admin ao Infisical disponivel fora do GitHub Actions -- este workflow
# e o unico jeito de escrever secrets sem login humano na instancia.
#
# Uso: Actions -> "Infisical - set secret" -> Run workflow, preencher
# secret_name e secret_value.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: "Nome do secret no Infisical (ex: STORAGE_SECRET_ACCESS_KEY)"
        required: true
      secret_value:
        description: "Valor novo do secret"
        required: true
      probe_only:
        description: "Se 'true', so testa permissao de criar projeto (nao escreve nenhum secret)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

jobs:
  set-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set secret in Infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          if [ "${{ inputs.probe_only }}" = "true" ]; then
            echo "--- who am I ---"
            curl -s "https://infisical.rangeltech.net/api/v2/users/me" -H "Authorization: Bearer $TOKEN"
            echo
            echo "--- list orgs ---"
            curl -s "https://infisical.rangeltech.net/api/v1/organization" -H "Authorization: Bearer $TOKEN"
            echo
            echo "--- list projects ---"
            curl -s "https://infisical.rangeltech.net/api/v2/workspace" -H "Authorization: Bearer $TOKEN"
            echo
            exit 0
          fi

          NAME="${{ inputs.secret_name }}"
          VALUE='${{ inputs.secret_value }}'
          echo "::add-mask::$VALUE"

          BODY=$(jq -n --arg v "$VALUE" '{workspaceId:"ea111402-d9d4-4ffe-b23f-ccc253340fd8",environment:"prod",secretPath:"/",secretValue:$v}')

          # Tenta update; se o secret nao existir ainda (404), cria.
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH "https://infisical.rangeltech.net/api/v3/secrets/raw/$NAME" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$BODY")

          if [ "$HTTP_CODE" = "404" ]; then
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
              -X POST "https://infisical.rangeltech.net/api/v3/secrets/raw/$NAME" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "$BODY")
          fi

          echo "http_code=$HTTP_CODE"
          cat /tmp/resp.json
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Infisical API returned $HTTP_CODE" >&2
            exit 1
          fi
          echo "OK: $NAME updated in Infisical"

      - name: Redeploy worker when a Meta credential changes
        # The worker restart runs installation_config:sync_meta, keeping the
        # persisted Chatwoot configuration aligned with Infisical. Other
        # secrets do not need a channel-config synchronization.
        if: >-
          ${{ inputs.probe_only != 'true' &&
              contains(fromJSON('["FB_APP_ID","FB_APP_SECRET","FB_VERIFY_TOKEN","INSTAGRAM_APP_ID","INSTAGRAM_APP_SECRET","INSTAGRAM_VERIFY_TOKEN"]'), inputs.secret_name) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Chatwoot worker to VPS" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
