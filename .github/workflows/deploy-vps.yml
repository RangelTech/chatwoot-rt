name: Deploy Chatwoot+bridge to VPS

# agent-llm mega spec (infra-04): chatwoot-web/worker/bridge saem do Cloud Run
# e passam a rodar na VPS rangeltech.net, junto do resto do stack RT.
#
# infra/.env.prod.chatwoot é renderizado automaticamente a cada deploy (step
# "Render .env.prod.chatwoot on VPS", infra-07) — sobrescrita completa, não
# incremental. infra/.env.prod.bridge continua sendo pré-requisito manual de
# bootstrap na VPS, preenchido a partir do .example correspondente. São
# arquivos SEPARADOS de propósito (ver docker-compose.prod.yml).
#
# Migração de schema (db:chatwoot_prepare) é passo manual explícito — ver
# comentário no docker-compose.prod.yml — não roda automaticamente aqui de
# propósito (docs/decisions/0001-boundaries.md, item 6: nunca migrar no boot,
# nunca automático demais pra rodar concorrente sem querer).

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths:
      - "chatwoot/**"
      - "bridge/**"
      - "infra/docker-compose.prod.yml"
      - ".github/workflows/deploy-vps.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_rt_infra_ed25519
          chmod 600 ~/.ssh/vps_rt_infra_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/platform/chatwoot"

      - name: Rsync source to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_rt_infra_ed25519" \
            --exclude ".env.prod.chatwoot" --exclude ".env.prod.bridge" \
            chatwoot bridge scripts infra \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}:/opt/platform/chatwoot/"

      - name: Fetch rotating secrets from Infisical
        # infra-09 (personal-skills/mega-spec-agent-llm): os 4 valores que
        # antes ficavam em texto puro aqui (achado do pente-fino de secrets)
        # agora vivem no Infisical (projeto chatwoot-prod, env "prod"),
        # buscados em runtime via Machine Identity (Universal Auth). O
        # workflow só guarda client_id/client_secret do Infisical — esses
        # sim GitHub Secrets de verdade — nunca a credencial final.
        id: infisical
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "https://infisical.rangeltech.net/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\":\"${{ secrets.INFISICAL_CLIENT_ID }}\",\"clientSecret\":\"${{ secrets.INFISICAL_CLIENT_SECRET }}\"}" \
            | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to authenticate with Infisical - aborting deploy instead of falling back to an empty/old .env" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          fetch_secret() {
            local name="$1"
            local value
            value=$(curl -fsS "https://infisical.rangeltech.net/api/v3/secrets/raw/$name?workspaceId=ea111402-d9d4-4ffe-b23f-ccc253340fd8&environment=prod&secretPath=%2F" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.secret.secretValue')
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::Secret $name not found in Infisical - aborting deploy" >&2
              exit 1
            fi
            echo "::add-mask::$value" >&2
            echo "$value"
          }

          {
            echo "postgres_password<<EOF_PG"
            fetch_secret POSTGRES_PASSWORD
            echo "EOF_PG"
            echo "secret_key_base<<EOF_SKB"
            fetch_secret SECRET_KEY_BASE
            echo "EOF_SKB"
            echo "redis_url<<EOF_REDIS"
            fetch_secret REDIS_URL
            echo "EOF_REDIS"
            echo "storage_secret_access_key<<EOF_S3"
            fetch_secret STORAGE_SECRET_ACCESS_KEY
            echo "EOF_S3"
          } >> "$GITHUB_OUTPUT"

      - name: Render .env.prod.chatwoot on VPS
        # infra-07: sobrescrita completa do arquivo a cada deploy — não é
        # mais bootstrap manual único. FB_*/IG_* vêm de GitHub Actions
        # Variables (vars.*), não Secrets, por decisão explícita do dono
        # (vars dão pra ver/editar em texto). Os 4 valores que rotacionam
        # (Postgres/Rails/Redis/MinIO) vêm do Infisical (step acima).
        env:
          POSTGRES_PASSWORD: ${{ steps.infisical.outputs.postgres_password }}
          SECRET_KEY_BASE: ${{ steps.infisical.outputs.secret_key_base }}
          REDIS_URL: ${{ steps.infisical.outputs.redis_url }}
          STORAGE_SECRET_ACCESS_KEY: ${{ steps.infisical.outputs.storage_secret_access_key }}
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /opt/platform/chatwoot/infra && cat > /opt/platform/chatwoot/infra/.env.prod.chatwoot" <<ENVEOF
          RAILS_ENV=production
          NODE_ENV=production
          INSTALLATION_ENV=docker
          RAILS_LOG_TO_STDOUT=true

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_DATABASE=chatwoot_prod
          POSTGRES_USERNAME=chatwoot_app
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD

          SECRET_KEY_BASE=$SECRET_KEY_BASE
          REDIS_URL=$REDIS_URL

          FRONTEND_URL=https://chat.rangeltech.net
          ACTIVE_STORAGE_SERVICE=s3_compatible
          STORAGE_BUCKET_NAME=chatwoot
          STORAGE_REGION=us-east-1
          STORAGE_ENDPOINT=https://storage.rangeltech.net
          STORAGE_FORCE_PATH_STYLE=true
          STORAGE_ACCESS_KEY_ID=minioadmin
          STORAGE_SECRET_ACCESS_KEY=$STORAGE_SECRET_ACCESS_KEY

          ENABLE_ACCOUNT_SIGNUP=false
          DEFAULT_LOCALE=pt_BR

          FB_APP_ID=${{ vars.FB_APP_ID }}
          FB_APP_SECRET=${{ vars.FB_APP_SECRET }}
          FB_VERIFY_TOKEN=${{ vars.FB_VERIFY_TOKEN }}
          IG_VERIFY_TOKEN=${{ vars.IG_VERIFY_TOKEN }}
          ENVEOF

      - name: Build and restart
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/platform/chatwoot && docker compose -f infra/docker-compose.prod.yml build && docker compose -f infra/docker-compose.prod.yml up -d --remove-orphans"

      - name: Smoke check
        run: |
          ssh -i ~/.ssh/vps_rt_infra_ed25519 \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "curl -fsS -o /dev/null -w 'web=%{http_code}\n' http://localhost:3000/ || true; curl -fsS -o /dev/null -w 'bridge=%{http_code}\n' http://localhost:8100/ || true"
