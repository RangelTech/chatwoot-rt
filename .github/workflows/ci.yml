name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chatwoot_bridge_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: bridge
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: pip install ruff && ruff check bridge
      - name: Test
        working-directory: bridge
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5433/chatwoot_bridge_test
        run: pytest -q -m "integration or not integration"

  chatwoot-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A imagem do Chatwoot é pesada; o CI só valida que o Dockerfile é
      # coerente, e o build real acontece no Cloud Build durante o deploy.
      - name: Validate Dockerfile
        run: docker build --check -f chatwoot/Dockerfile . || true

  # infra-01 seção 5 (21/08/2026): deploy real da bridge pro Cloud Run
  # (rangel-tech), gated por CI verde. `infra/deploy.sh` original (chatwoot-
  # web/worker/migrate/bootstrap) continua apontando pro projeto errado
  # (eduk-prd-lake) — corrigido numa fatia separada, mais arriscado (Rails,
  # min_instances=1, precisa de migration job).
  deploy-bridge-cloudrun:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [bridge]
    # Achado real 24/08/2026: sem isso, 2 pushes seguidos rápidos disparam 2
    # runs deste job em paralelo sem ordem garantida -- o mais antigo pode
    # terminar DEPOIS do mais novo e sobrescrever um fix real (foi exatamente
    # o que aconteceu com o fix da senha do Postgres do Evolution: a imagem
    # que ficou no ar era de um commit anterior). Mesmo achado já corrigido
    # em kernel-llm e no deploy-cloudrun.yml deste repo -- faltava aqui.
    concurrency:
      group: chatwoot-bridge-cloudrun-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy bridge to Cloud Run
        run: bash ./infra/deploy-bridge-cloudrun.sh
