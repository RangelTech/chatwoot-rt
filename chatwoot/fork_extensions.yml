# Machine-readable contract for the customizations carried by chatwoot-rt.
# Keep this file current whenever an upstream Chatwoot upgrade is prepared.
schema_version: 1
upstream_version: "4.16.2"
extensions:
  - id: sso_session_sync
    status: active
    strategy: small_upstream_patch
    purpose: Platform API logout endpoint (RAtende<->RAgentes session sync, produto-05 secao 6c) -- pair of the pre-existing :login SSO action.
    required_paths:
      - config/routes.rb
      - app/controllers/platform/api/v1/users_controller.rb
    touchpoints:
      - config/routes.rb
      - app/controllers/platform/api/v1/users_controller.rb
    markers:
      config/routes.rb: "post :logout"
      app/controllers/platform/api/v1/users_controller.rb: "def logout"

  - id: ai_assist_api_base
    status: active
    strategy: small_upstream_patch
    purpose: Per-account OpenAI-compatible API base for AI Assist.
    required_paths:
      - lib/integrations/llm_base_service.rb
      - lib/integrations/openai/key_validator.rb
      - config/integration/apps.yml
      - spec/lib/integrations/llm_base_service_spec.rb
    markers:
      lib/integrations/llm_base_service.rb: "hook.settings['api_base']"
      config/integration/apps.yml: "'api_base': { 'type': 'string' }"

  - id: channel_wapi
    status: active
    strategy: additive_with_upstream_touchpoints
    purpose: WAPI inbox channel and inbound webhook processing.
    required_paths:
      - app/models/channel/wapi.rb
      - app/controllers/webhooks/wapi_controller.rb
      - app/jobs/webhooks/wapi_events_job.rb
      - app/services/wapi/incoming_message_service.rb
      - app/services/wapi/payload_normalizer.rb
      - app/services/wapi/client.rb
      - app/services/wapi/send_on_wapi_service.rb
      - app/services/wapi/connection_test_service.rb
      - db/migrate/20260819000000_create_channel_wapi.rb
      - spec/models/channel/wapi_spec.rb
      - spec/requests/api/v1/accounts/inboxes_wapi_spec.rb
    touchpoints:
      - app/models/account.rb
      - app/controllers/api/v1/accounts/inboxes_controller.rb
      - app/helpers/api/v1/inboxes_helper.rb
      - config/routes.rb
    markers:
      app/models/account.rb: "has_many :wapi_channels"
      app/controllers/api/v1/accounts/inboxes_controller.rb: "'wapi' => Channel::Wapi"
      app/helpers/api/v1/inboxes_helper.rb: "'wapi' => Current.account.wapi_channels"
      config/routes.rb: "post 'webhooks/wapi/:project_id'"

  - id: channel_unofficial_gateway
    status: active
    strategy: additive_with_upstream_touchpoints
    purpose: Unofficial channels (Instagram, Messenger, WhatsApp, TikTok) connected by the channels gateway (user/password or QR); signed webhook in, gateway send out.
    required_paths:
      - app/models/concerns/unofficial_gateway_channel.rb
      - app/models/channel/instagram_unofficial.rb
      - app/models/channel/messenger_unofficial.rb
      - app/models/channel/whatsapp_unofficial.rb
      - app/models/channel/tiktok_unofficial.rb
      - app/controllers/webhooks/channels_controller.rb
      - app/controllers/api/v1/accounts/channel_connections_controller.rb
      - app/policies/channel_connection_policy.rb
      - app/services/channels/gateway_client.rb
      - app/services/channels/incoming_message_service.rb
      - app/services/channels/send_on_unofficial_service.rb
      - db/migrate/20261020000100_create_channel_unofficial_gateway.rb
      - db/migrate/20261020000200_legacy_unofficial_cookies_to_reauth_required.rb
      - spec/requests/webhooks/channels_spec.rb
      - spec/requests/api/v1/accounts/channel_connections_spec.rb
    touchpoints:
      - app/models/account.rb
      - app/jobs/send_reply_job.rb
      - config/routes.rb
      - config/initializers/filter_parameter_logging.rb
    markers:
      app/models/account.rb: "has_many :messenger_unofficial_channels"
      app/jobs/send_reply_job.rb: "'Channel::MessengerUnofficial' => ::Channels::SendOnUnofficialService"
      config/routes.rb: "post 'webhooks/channels/:channel_type/:id'"
      config/initializers/filter_parameter_logging.rb: "verification_code"

  - id: channel_evolution_api
    status: active
    strategy: additive_with_new_migration
    purpose: Future Evolution API channel; intentionally not implemented yet.
    required_paths:
      - app/models/channel/evolution_api.rb
      - app/controllers/webhooks/evolution_controller.rb
      - app/jobs/webhooks/evolution_events_job.rb
      - app/services/evolution/client.rb
      - app/services/evolution/incoming_message_service.rb
      - app/services/evolution/send_on_evolution_service.rb
      - db/migrate/20260821000000_create_channel_evolution_api.rb
      - spec/models/channel/evolution_api_spec.rb
      - spec/jobs/webhooks/evolution_events_job_spec.rb
    touchpoints:
      - app/models/account.rb
      - app/controllers/api/v1/accounts/inboxes_controller.rb
      - app/helpers/api/v1/inboxes_helper.rb
      - app/jobs/send_reply_job.rb
      - config/routes.rb
    markers:
      app/models/account.rb: "has_many :evolution_api_channels"
      app/controllers/api/v1/accounts/inboxes_controller.rb: "'evolution_api' => Channel::EvolutionApi"
      app/helpers/api/v1/inboxes_helper.rb: "'evolution_api' => Current.account.evolution_api_channels"
      app/jobs/send_reply_job.rb: "'Channel::EvolutionApi' => ::Evolution::SendOnEvolutionService"
      config/routes.rb: "post 'webhooks/evolution/:instance_name'"

  - id: branding_and_entrypoints
    status: active
    strategy: overlay_and_custom_entrypoints
    purpose: External branding overlay plus RT web and worker entrypoints.
    required_paths:
      - branding/README.md
      - entrypoints/web.sh
      - entrypoints/worker.sh
      - Dockerfile
    markers:
      Dockerfile: "COPY chatwoot/entrypoints/web.sh /app/rt-web.sh"
      entrypoints/web.sh: "bundle exec rails server"
      entrypoints/worker.sh: "bundle exec sidekiq"

  - id: rt_ai_unification
    status: active
    strategy: additive_with_upstream_touchpoints
    purpose: Spec 10 -- AI permissions (ai.*) on AccountUser, Account lifecycle outbox to the AI engine, provisional password, Super Admin AI actions.
    required_paths:
      - app/models/rt/ai_roles.rb
      - app/models/rt/ai_grant.rb
      - app/models/rt/ai_account.rb
      - app/models/rt/outbox_event.rb
      - app/models/concerns/rt/account_user_permissions.rb
      - app/models/concerns/rt/account_lifecycle.rb
      - app/models/concerns/rt/user_provisional_password.rb
      - app/services/rt/engine_client.rb
      - app/services/rt/provisional_password.rb
      - app/jobs/rt/outbox_job.rb
      - app/policies/rt/ai_policy.rb
      - app/controllers/api/v1/accounts/rt_ai/members_controller.rb
      - db/migrate/20261019000000_create_rt_ai_grants.rb
      - db/migrate/20261019000100_create_rt_ai_accounts_and_outbox.rb
      - spec/models/rt/ai_roles_spec.rb
    touchpoints:
      - app/models/account.rb
      - app/models/account_user.rb
      - app/models/user.rb
      - app/controllers/api/base_controller.rb
      - app/controllers/super_admin/accounts_controller.rb
      - app/controllers/super_admin/users_controller.rb
      - app/dashboards/account_dashboard.rb
      - config/routes.rb
      - config/schedule.yml
    markers:
      app/models/account.rb: "Account.prepend(Rt::AccountLifecycle)"
      app/models/account_user.rb: "AccountUser.prepend(Rt::AccountUserPermissions)"
      app/models/user.rb: "User.prepend(Rt::UserProvisionalPassword)"
      app/controllers/api/base_controller.rb: "block_until_password_changed"
      config/routes.rb: "namespace :rt_ai"
      config/schedule.yml: "rt_outbox_job"
      app/controllers/super_admin/accounts_controller.rb: "Rt::AccountLifecycle.enqueue"
      app/controllers/super_admin/users_controller.rb: "Rt::ProvisionalPassword.issue!"
      app/dashboards/account_dashboard.rb: "ai_state"


  - id: rt_ai_ui_touchpoints
    status: active
    strategy: registration_points_only
    purpose: Spec 10 -- pontos de registro no nucleo para as telas Vue de IA e Kanban (menu lateral, rotas, permissoes ai.*, barramento de eventos, troca de conta, senha provisoria, listener do Kanban, partials do Super Admin). O resto vive em pastas rt/ragent/kanban.
    required_paths:
      - app/javascript/dashboard/routes/dashboard/ragent/ragent.routes.js
      - app/javascript/dashboard/routes/dashboard/kanban/kanban.routes.js
      - app/javascript/dashboard/helper/ragentLanding.js
      - app/javascript/dashboard/api/rtKanban.js
    touchpoints:
      - app/javascript/dashboard/components-next/sidebar/Sidebar.vue
      - app/javascript/dashboard/components-next/sidebar/SidebarAccountSwitcher.vue
      - app/javascript/dashboard/routes/dashboard/dashboard.routes.js
      - app/javascript/dashboard/routes/index.js
      - app/javascript/dashboard/constants/permissions.js
      - app/javascript/dashboard/helper/APIHelper.js
      - app/javascript/dashboard/helper/actionCable.js
      - app/javascript/shared/constants/busEvents.js
      - app/javascript/dashboard/routes/dashboard/settings/agents/Index.vue
      - app/javascript/v3/helpers/AuthHelper.js
      - app/javascript/dashboard/App.vue
      - app/dispatchers/async_dispatcher.rb
      - app/models/conversation.rb
      - app/views/super_admin/accounts/show.html.erb
      - app/views/super_admin/users/show.html.erb
      - app/javascript/dashboard/routes/index.spec.js
      - app/javascript/v3/helpers/specs/AuthHelper.spec.js
    markers:
      app/javascript/dashboard/components-next/sidebar/Sidebar.vue: "RtKanbanAPI"
      app/javascript/dashboard/components-next/sidebar/SidebarAccountSwitcher.vue: "ragentLandingPath"
      app/javascript/dashboard/routes/dashboard/dashboard.routes.js: "...ragentRoutes"
      app/javascript/dashboard/routes/index.js: "ragentLandingPath"
      app/javascript/dashboard/constants/permissions.js: "export const AI_PERMISSIONS"
      app/javascript/dashboard/helper/APIHelper.js: "must_change_password"
      app/javascript/dashboard/helper/actionCable.js: "rt_kanban.changed"
      app/javascript/shared/constants/busEvents.js: "RT_KANBAN_CHANGED"
      app/javascript/dashboard/routes/dashboard/settings/agents/Index.vue: "<AiRolesPanel />"
      app/javascript/v3/helpers/AuthHelper.js: "frontendURL(accountPath)"
      app/javascript/dashboard/App.vue: "ragentes_branding"
      app/dispatchers/async_dispatcher.rb: "RtKanban::ConversationListener.instance"
      app/models/conversation.rb: "Conversation.prepend(Rt::ConversationKanban)"
      app/views/super_admin/accounts/show.html.erb: 'partial: "ai_state"'
      app/views/super_admin/users/show.html.erb: 'partial: "provisional_password"'
      app/javascript/dashboard/routes/index.spec.js: "is not a member of"
      app/javascript/v3/helpers/specs/AuthHelper.spec.js: "/app/accounts/7501"

  - id: channels_ui_touchpoints
    status: active
    strategy: registration_points_only
    purpose: Pontos de registro no nucleo para os canais WAPI/Evolution e conectores nao oficiais (API de caixas, seletor de canal, nome do canal, politica, jbuilder, preferencia por Account).
    required_paths:
      - app/javascript/dashboard/routes/dashboard/settings/inbox/channels/Wapi.vue
      - app/javascript/dashboard/routes/dashboard/settings/inbox/channels/EvolutionApi.vue
      - app/javascript/dashboard/routes/dashboard/settings/account/components/UnofficialChannels.vue
    touchpoints:
      - app/javascript/dashboard/api/inboxes.js
      - app/javascript/dashboard/components/widgets/ChannelItem.vue
      - app/javascript/dashboard/helper/inbox.js
      - app/javascript/dashboard/routes/dashboard/settings/inbox/ChannelFactory.vue
      - app/javascript/dashboard/routes/dashboard/settings/inbox/ChannelList.vue
      - app/javascript/dashboard/routes/dashboard/settings/inbox/components/ChannelName.vue
      - app/javascript/dashboard/routes/dashboard/settings/account/Index.vue
      - app/javascript/dashboard/routes/dashboard/settings/inbox/channels/Whatsapp.vue
      - app/controllers/api/v1/accounts_controller.rb
      - app/models/inbox.rb
      - app/policies/inbox_policy.rb
      - app/views/api/v1/models/_inbox.json.jbuilder
    markers:
      app/javascript/dashboard/api/inboxes.js: "provisionEvolution"
      app/javascript/dashboard/components/widgets/ChannelItem.vue: "'evolution_api'"
      app/javascript/dashboard/helper/inbox.js: "EVOLUTION_API: 'Channel::EvolutionApi'"
      app/javascript/dashboard/routes/dashboard/settings/inbox/ChannelFactory.vue: "import EvolutionApi"
      app/javascript/dashboard/routes/dashboard/settings/inbox/ChannelList.vue: "instagram_unofficial"
      app/javascript/dashboard/routes/dashboard/settings/inbox/components/ChannelName.vue: "'Channel::EvolutionApi'"
      app/javascript/dashboard/routes/dashboard/settings/account/Index.vue: "UnofficialChannels"
      app/javascript/dashboard/routes/dashboard/settings/inbox/channels/Whatsapp.vue: "hasWhatsappConfigurationId"
      app/controllers/api/v1/accounts_controller.rb: ":show_unofficial_channels"
      app/models/inbox.rb: "deprovision_evolution_on_bridge!"
      app/policies/inbox_policy.rb: "def provision_evolution?"
      app/views/api/v1/models/_inbox.json.jbuilder: "resource.wapi? || resource.evolution_api?"

  - id: platform_hardening
    status: active
    strategy: small_upstream_patch
    purpose: Correcoes pequenas de robustez no nucleo (saude real do banco, cache de configuracao global, valor false legitimo, pagina publica de dominio).
    touchpoints:
      - app/controllers/api_controller.rb
      - app/controllers/public_controller.rb
      - lib/global_config.rb
      - lib/global_config_service.rb
      - app/controllers/concerns/instagram_concern.rb
    markers:
      app/controllers/concerns/instagram_concern.rb: "https://www.instagram.com/oauth/authorize"
      app/controllers/api_controller.rb: "SELECT 1"
      app/controllers/public_controller.rb: "suporte@rangeltech.net"
      lib/global_config.rb: "conn.mget(*cache_keys)"
      lib/global_config_service.rb: "config == ''"

