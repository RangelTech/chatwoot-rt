  - id: upgrade_cycle
    status: active
    strategy: additive_with_upstream_touchpoints
    purpose: Fase UP -- ciclo mensal de atualizacao. Telemetria desligada (hub do Chatwoot), verificacao propria de versao, cartao no Super Admin, relatorio do ensaio semanal. Aviso de versao nunca na aplicacao do usuario.
    required_paths:
      - app/services/rt/upgrade_status.rb
      - app/services/rt/upstream_version_check.rb
      - app/services/rt/chatwoot_hub_guard.rb
      - app/jobs/rt/upstream_version_check_job.rb
      - app/controllers/rt/upgrade_rehearsals_controller.rb
      - app/views/super_admin/instance_statuses/_chatwoot_update.html.erb
      - config/initializers/rt_telemetry.rb
    touchpoints:
      - app/controllers/api/v1/accounts_controller.rb
      - app/views/super_admin/instance_statuses/show.html.erb
      - app/javascript/dashboard/components/app/UpdateBanner.vue
      - config/schedule.yml
    markers:
      app/controllers/api/v1/accounts_controller.rb: "@latest_chatwoot_version = nil"
      app/views/super_admin/instance_statuses/show.html.erb: "chatwoot_update"
      app/javascript/dashboard/components/app/UpdateBanner.vue: "showUpstreamUpdateBanner"
      config/schedule.yml: "rt_upstream_version_check_job"
      config/initializers/rt_telemetry.rb: "Rt::ChatwootHubGuard"
