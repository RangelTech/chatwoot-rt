# Produção na VPS rangeltech.net (agent-llm mega spec, infra-04).
# Só o worker (Sidekiq) roda na VPS. web e bridge saíram pro Cloud Run
# (infra-01 §7, cutover real em 21/08/2026) — Cloud Run cobra CPU sempre
# alocada pra processo permanentemente conectado ao Redis (worker), então
# só ele fica aqui; web/bridge são request-driven, ótimo fit pro Cloud Run
# (min_instances=0/1, escala sozinho). Entra na rede Docker externa do
# vps_rt_infra (precisa desse stack já de pé).
#
# Simplificação feita nesta migração (registrada em infra-04): Postgres e
# Redis são acessados por nome de serviço Docker (`postgres`/`redis`),
# rede interna, sem TLS necessário — mais simples e sem exposição pública
# desnecessária desses dois bancos, já que o worker roda na mesma VPS.
#
# Migração de schema é passo EXPLÍCITO (docs/decisions/0001-boundaries.md,
# item 6) — nunca no boot do container. Roda contra o Cloud Run via
# `chatwoot-rt/infra/deploy.sh migrate` (job `chatwoot-migrate`), não mais
# aqui.
#
# `.env.prod.chatwoot` segue sendo o env_file do worker — historicamente
# compartilhado com web, mantido pelo mesmo nome pra não quebrar o
# workflow de deploy (`deploy-vps.yml` renderiza esse arquivo a cada push).
#
# Deploy real via pipeline do vps_rt_infra/CI, não SSH manual.
#
# `name:` explícito — achado real em produção (17/08/2026): sem isso, os
# projetos Compose deste repo e do agent-platform colidiam (mesmo nome de
# projeto inferido), e um `up -d --remove-orphans` de um apagava os
# containers do outro.
name: chatwoot
services:
  chatwoot-worker:
    build:
      context: ..
      dockerfile: chatwoot/Dockerfile
    container_name: chatwoot-worker
    restart: unless-stopped
    command: ./rt-worker.sh
    env_file:
      - .env.prod.chatwoot
    networks:
      - internal
      # Sidekiq chama URLs públicas (bridge.rangeltech.net, agora no Cloud
      # Run) pros webhooks de Agent Bot -- sem a rede `public`, o worker
      # fica sem rota de saída pra internet (`internal` tem internal:true
      # no vps_rt_infra, sem gateway). Achado real em producao (17/08/2026):
      # parecia erro de DNS (falhava pra QUALQUER host), mas era falta de
      # rota mesmo — sem network pública, nem DNS externo resolve.
      - public
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  internal:
    name: internal
    external: true
  public:
    name: public
    external: true
